name: KOYAL AI checks

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run local memory tests
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder
